# Forja Modular — orquestación
#   Local / LAN:            docker compose up -d --build
#   Publicar por Internet:  docker compose --profile tunnel up -d --build   (requiere CLOUDFLARE_TUNNEL_TOKEN en .env)
name: forja-modular

services:
  web:
    build:
      context: ${FORJA_BUILD_CONTEXT:-.}
      target: runtime
      args:
        DOMINIO_BASE: ${DOMINIO_BASE:-homelab.lan}
        ESQUEMA_URL: ${ESQUEMA_URL:-http}
        WEB_PORT: ${WEB_PORT:-19085}
        MOSTRAR_INDICE: ${MOSTRAR_INDICE:-true}
    container_name: forja-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-19085}:8080"
    volumes:
      - forja_dist:/usr/share/nginx/html/sites:ro
    # Endurecimiento del contenedor (compatible con nginxinc/nginx-unprivileged en modo read_only)
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  studio:
    build:
      context: ${FORJA_BUILD_CONTEXT:-.}
      target: studio
      args:
        DOMINIO_BASE: ${DOMINIO_BASE:-homelab.lan}
        ESQUEMA_URL: ${ESQUEMA_URL:-http}
        WEB_PORT: ${WEB_PORT:-19085}
        MOSTRAR_INDICE: ${MOSTRAR_INDICE:-true}
    container_name: forja-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-19086}:4322"
    environment:
      - STUDIO_HOST=0.0.0.0
      - STUDIO_PORT=4322
      - STUDIO_TOKEN=${STUDIO_TOKEN:-}
      - DOMINIO_BASE=${DOMINIO_BASE:-homelab.lan}
      - ESQUEMA_URL=${ESQUEMA_URL:-http}
      - MOSTRAR_INDICE=${MOSTRAR_INDICE:-true}
      - QDRANT_URL=${QDRANT_URL:-http://192.168.20.52:6333}
      - DEEPSEEK_HARNESS_URL=${DEEPSEEK_HARNESS_URL:-http://192.168.20.52:3090}
    volumes:
      - forja_sites:/app/sites
      - forja_dist:/app/dist-sites
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: forja-tunnel
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  forja_sites:
  forja_dist:

