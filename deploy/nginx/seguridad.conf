# Cabeceras de seguridad HTTP (se incluyen en cada server/location que use add_header).
# CSP estricta: sin JavaScript en línea; solo scripts propios. Google Maps permitido en iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS se configura en el proxy TLS (Cloudflare / Nginx Proxy Manager), no aquí, porque este contenedor sirve HTTP interno.
