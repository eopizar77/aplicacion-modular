# Servidor multi-sitio de Forja Modular.
# Soporta dos modos simultáneos:
#   1. Por ruta (sin crear subdominios DNS): http://forja.homelab.lan/<slug>/ o http://192.168.20.52:19085/<slug>/
#   2. Por subdominio:                       http://<slug>.homelab.lan/ (redirige o sirve /<slug>/)

server_tokens off;
charset utf-8;
absolute_redirect off;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# Límite de peticiones por IP (mitiga abuso/scraping agresivo). 20 req/s con ráfaga de 40.
limit_req_zone $binary_remote_addr zone=porip:10m rate=20r/s;

# ---------------------------------------------------------------- servidor principal (rutas /<slug>/ + índice en /)
server {
    listen 8080 default_server;
    server_name _ ~^forja\.;
    root /usr/share/nginx/html/sites;
    include /etc/nginx/snippets/seguridad.conf;
    limit_req zone=porip burst=40 nodelay;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nunca servir archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Raíz /: muestra el índice de sitios generados
    location = / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files /_indice/index.html =404;
    }

    # Recursos con hash de Astro dentro de cualquier sitio (/<slug>/_astro/...)
    location ~ ^/[a-z0-9-]+/_astro/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Assets de cualquier sitio (/<slug>/assets/...)
    location ~ ^/[a-z0-9-]+/assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Páginas de cada sitio (/<slug>/ y /<slug>/privacidad/)
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}

