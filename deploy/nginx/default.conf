# Servidor multi-sitio de Forja Modular.
# Cada sitio vive en /usr/share/nginx/html/sites/<slug> y se sirve en <slug>.<dominio>.
# Ej: demo-restaurante.localhost:8080  ->  sites/demo-restaurante/

server_tokens off;
charset utf-8;

gzip on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# Límite de peticiones por IP (mitiga abuso/scraping agresivo). 20 req/s con ráfaga de 40.
limit_req_zone $binary_remote_addr zone=porip:10m rate=20r/s;

# ---------------------------------------------------------------- servidor por defecto / portal forja.homelab.lan
# Atiende peticiones a forja.<dominio>, localhost o IP directa (192.168.20.52:19085).
# Muestra el índice interno si existe (MOSTRAR_INDICE=true en el build), si no, 404.
server {
    listen 8080 default_server;
    server_name _ ~^forja\.;
    root /usr/share/nginx/html/sites/_indice;
    include /etc/nginx/snippets/seguridad.conf;
    limit_req zone=porip burst=40 nodelay;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        try_files $uri $uri/index.html =404;
    }
}

# ---------------------------------------------------------------- sitios de clientes
server {
    listen 8080;
    # El slug debe contener al menos una letra (así una IP como 192.168.1.10 no se toma como slug).
    server_name ~^(?<slug>[a-z0-9-]*[a-z][a-z0-9-]*)\.;
    root /usr/share/nginx/html/sites/$slug;
    include /etc/nginx/snippets/seguridad.conf;
    limit_req zone=porip burst=40 nodelay;

    # Nunca servir archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Recursos con hash en el nombre: caché de 1 año
    location /_astro/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/seguridad.conf;
        internal;
    }
}
